<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!--
    Bold "C" arc:
    Center ~(270, 256), radius ~148
    Starts at top-right (270+148, 256-148) ≈ (418, 108)  → top opening
    Sweeps 300° counter-clockwise leaving a clean right-side gap
  -->
  <path
    d="M 358 136 A 155 155 0 1 0 358 376"
    fill="none"
    stroke="url(#cGrad)"
    stroke-width="78"
    stroke-linecap="round"
  />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Receipt body -->
  <rect x="136" y="84" width="240" height="306" rx="20" fill="white"/>

  <!-- Receipt zigzag bottom (scalloped edge) -->
  <polygon
    points="136,390 148,374 160,390 172,374 184,390 196,374 208,390 220,374 232,390 244,374 256,390 268,374 280,390 292,374 304,390 316,374 328,390 340,374 352,390 364,374 376,390 376,410 136,410"
    fill="url(#bg)"
  />

  <!-- Text lines (receipt content) -->
  <rect x="168" y="122" width="176" height="15" rx="7.5" fill="#c7d2fe"/>
  <rect x="168" y="152" width="136" height="10" rx="5"   fill="#e0e7ff"/>
  <rect x="168" y="171" width="156" height="10" rx="5"   fill="#e0e7ff"/>
  <rect x="168" y="190" width="116" height="10" rx="5"   fill="#e0e7ff"/>

  <!-- Divider -->
  <rect x="168" y="215" width="176" height="2.5" rx="1.25" fill="#a5b4fc"/>

  <!-- Price rows -->
  <rect x="168" y="229" width="76" height="10" rx="5" fill="#c7d2fe"/>
  <rect x="264" y="227" width="80" height="14" rx="7" fill="#4f46e5" opacity="0.25"/>

  <rect x="168" y="252" width="76" height="10" rx="5" fill="#c7d2fe"/>
  <rect x="264" y="250" width="80" height="14" rx="7" fill="#4f46e5" opacity="0.25"/>

  <!-- Total divider -->
  <rect x="168" y="277" width="176" height="2.5" rx="1.25" fill="#818cf8"/>

  <!-- Total (bold) -->
  <rect x="168" y="291" width="56" height="14" rx="7"   fill="#c7d2fe"/>
  <rect x="252" y="289" width="92" height="18" rx="9"   fill="#4338ca"/>

  <!-- Barcode area -->
  <rect x="168" y="322" width="176" height="56" rx="10" fill="#eef2ff"/>

  <!-- Barcode lines -->
  <g fill="#3730a3">
    <rect x="180" y="334" width="4"  height="32"/>
    <rect x="188" y="334" width="7"  height="32"/>
    <rect x="199" y="334" width="2"  height="32"/>
    <rect x="205" y="334" width="9"  height="32"/>
    <rect x="218" y="334" width="3"  height="32"/>
    <rect x="225" y="334" width="5"  height="32"/>
    <rect x="234" y="334" width="2"  height="32"/>
    <rect x="240" y="334" width="8"  height="32"/>
    <rect x="252" y="334" width="4"  height="32"/>
    <rect x="260" y="334" width="6"  height="32"/>
    <rect x="270" y="334" width="2"  height="32"/>
    <rect x="276" y="334" width="5"  height="32"/>
    <rect x="285" y="334" width="9"  height="32"/>
    <rect x="298" y="334" width="3"  height="32"/>
    <rect x="305" y="334" width="2"  height="32"/>
    <rect x="311" y="334" width="7"  height="32"/>
    <rect x="322" y="334" width="4"  height="32"/>
    <rect x="330" y="334" width="6"  height="32"/>
  </g>

  <!-- Scan line (red) over barcode -->
  <rect x="136" y="347" width="240" height="6" rx="3"  fill="#ef4444" opacity="0.9"/>
  <rect x="136" y="341" width="240" height="18" rx="9" fill="#ef4444" opacity="0.12"/>
</svg>
